name: Release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run qa:web
      - run: npm run verify:web
